global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: 'vortex-api'
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ['host.docker.internal:53562']

  - job_name: 'executor-core'
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ['executor-core:8001']

  - job_name: 'executor-java'
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ['executor-java:8002']
